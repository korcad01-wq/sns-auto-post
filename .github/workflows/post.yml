name: Daily SNS Post

on:
  schedule:
    # 하루 1회. 정각(:00)은 GitHub 예약 실행이 몰려 3~5시간씩 밀린 기록이 있어 :23 으로 비껴 둠
    - cron: '23 0 * * *'  # UTC 00:23 = KST 09:23, 매일
  workflow_dispatch:
    inputs:
      date:
        description: '테스트용 날짜(YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
      dry_run:
        description: '선택 결과만 출력(게시 안 함)'
        required: false
        default: false
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
      POST_DATE: ${{ github.event.inputs.date }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Post to Instagram
        run: python post_instagram.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # Instagram 단계가 실패해도(토큰 만료 등) Threads 는 독립적으로 게시한다.
      - name: Post to Threads
        if: ${{ !cancelled() }}
        run: python post_threads.py
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
