name: Daily SNS Post

on:
  schedule:
    # v3 (2026-10-10): 밤 9시 전후 게시(쓰레드 전자책 실측 — 1만 회 넘긴 글은 전부 20~22시 발행).
    # 1차 트리거는 로컬 작업 스케줄러 「SNS 저녁 게시 (21:00)」 의 workflow_dispatch, 이 cron 은 PC 가 꺼진 날의 백업.
    # 둘 다 돌아도 스크립트가 "오늘 같은 글" 을 API 로 확인해 한 번만 올린다. 정각은 GitHub 예약이 몰려 밀리므로 :23.
    - cron: '23 12 * * 1-5'  # UTC 12:23 = KST 21:23, 월~금 (토·일은 content_calendar.json schedule 에서 쉼)
  workflow_dispatch:
    inputs:
      date:
        description: '테스트용 날짜(YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
      dry_run:
        description: '선택 결과만 출력(게시 안 함)'
        required: false
        default: false
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
      POST_DATE: ${{ github.event.inputs.date }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Post to Instagram
        run: python post_instagram.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # Instagram 단계가 실패해도(토큰 만료 등) Threads 는 독립적으로 게시한다.
      - name: Post to Threads
        if: ${{ !cancelled() }}
        run: python post_threads.py
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
